apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../api
  - ../../sqs-consumer

# En local, usamos réplicas fijas y variables para Docker/LocalStack
patches:
  - target:
      kind: Deployment
      name: api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value # APP_ENV
        value: "local"

  - target:
      kind: Deployment
      name: sqs-consumer
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

# Generamos el secreto para KEDA en local (necesario para TriggerAuthentication)
secretGenerator:
  - name: aws-secrets
    literals:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    options:
      disableNameSuffixHash: true
