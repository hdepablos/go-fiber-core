apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: api
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9009
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 9009
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 9009
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
            - name: APP_ENV
              value: "local"
            - name: SERVER_PORT
              value: "9009"
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ENDPOINT_URL
              value: "http://host.docker.internal:4566"
            - name: SQS_QUEUE_URL
              value: "http://host.docker.internal:4566/000000000000/gofibercorequeue"
            
            # Database
            - name: DB_HOST
              value: "host.docker.internal"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: DB_NAME
              value: "go_fiber_core"
            
            # Redis
            - name: REDIS_HOST
              value: "host.docker.internal"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              value: "eYVX7EwVmmxKPCDmwMtyKVge8oLd2t81"
            
            # GORM Writer
            - name: GORM_WRITE_DRIVER
              value: "postgres"
            - name: GORM_WRITE_HOST
              value: "host.docker.internal"
            - name: GORM_WRITE_PORT
              value: "5432"
            - name: GORM_WRITE_USER
              value: "postgres" # Simplificado para local
            - name: GORM_WRITE_PASSWORD
              value: "postgres"
            - name: GORM_WRITE_DBNAME
              value: "go_fiber_core"
            
            # GORM Reader
            - name: GORM_READ_DRIVER
              value: "postgres"
            - name: GORM_READ_HOST
              value: "host.docker.internal"
            - name: GORM_READ_PORT
              value: "5432"
            - name: GORM_READ_USER
              value: "postgres"
            - name: GORM_READ_PASSWORD
              value: "postgres"
            - name: GORM_READ_DBNAME
              value: "go_fiber_core"

            # PGX Writer
            - name: PGX_WRITE_HOST
              value: "host.docker.internal"
            - name: PGX_WRITE_PORT
              value: "5432"
            - name: PGX_WRITE_USER
              value: "postgres"
            - name: PGX_WRITE_PASSWORD
              value: "postgres"
            - name: PGX_WRITE_DBNAME
              value: "go_fiber_core"
            - name: PGX_WRITE_MAX_CONNS
              value: "15"

            # PGX Reader
            - name: PGX_READ_HOST
              value: "host.docker.internal"
            - name: PGX_READ_PORT
              value: "5432"
            - name: PGX_READ_USER
              value: "postgres"
            - name: PGX_READ_PASSWORD
              value: "postgres"
            - name: PGX_READ_DBNAME
              value: "go_fiber_core"
            - name: PGX_READ_MAX_CONNS
              value: "15"

            # JWT
            - name: JWT_ACCESS_TTL_MINUTES
              value: "15m"
            - name: JWT_REFRESH_TTL_DAYS
              value: "720h"
            - name: JWT_ACCESS_SECRET
              value: "test-secret"
            - name: JWT_REFRESH_SECRET
              value: "test-secret"
