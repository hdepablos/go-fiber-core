apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-fiber-core-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hdepablos/go-fiber-core.git
    targetRevision: HEAD
    path: k8s/overlays/local
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
