services:
  go-fiber-core:
    build:
      context: .
      dockerfile: ./dockerfiles/Dockerfile.api.${APP_ENV}
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
    volumes:
      - .:/app
      - ./cmd:/app/cmd
      - ./internal:/app/internal
      - ./air.api.toml:/app/air.api.toml
      - go-cache:/go
    command: >
      sh -c "if [ ${APP_ENV} = 'local' ]; then air -c air.api.toml; else /app/bin/app; fi" # <--- ¡IMPORTANTE! Indicarle a Air que use air.api.toml
    networks:
      - nginx-proxy
